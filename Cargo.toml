[workspace]
members = ["crates/arca-core", "crates/arca-cli", "apps/desktop/src-tauri", "apps/mobile/rust"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"

[workspace.dependencies]
arca-core = { path = "crates/arca-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

# Perfil de release (https://tauri.app/concept/size/). Sem `panic = "abort"`: o `arca ping`
# usa catch_unwind para nunca derrubar um hook.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
