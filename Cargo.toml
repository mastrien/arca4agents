[package]
name = "arca"
version = "0.2.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = { version = "1", features = ["from-directory"] }
include_dir = "0.7"
anyhow = "1"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
