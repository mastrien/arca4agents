[package]
name = "arca"
version = "0.2.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = { version = "1", features = ["from-directory"] }
include_dir = "0.7"
anyhow = "1"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
serde = { version = "1.0.229", features = ["derive"] }
terminal_size = "0.4.4"
