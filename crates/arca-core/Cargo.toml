[package]
name = "arca-core"
description = "Núcleo do Arca for Agents: banco, rollover, projetos, política de agentes e sincronização"
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
rusqlite_migration = { version = "1", features = ["from-directory"] }
include_dir = "0.7"
directories = "5"
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1.29.0", features = ["v4"] }
ureq = { version = "3.5", default-features = false, features = ["json"], optional = true }
tiny_http = { version = "0.12", optional = true }
local-ip-address = { version = "0.6", optional = true }

[features]
# Servidor de sincronização (`arca serve`, app desktop).
server = ["dep:tiny_http", "dep:local-ip-address"]
# Cliente de sincronização (celular; também a CLI, para testes entre dois PCs).
client = ["dep:ureq"]
